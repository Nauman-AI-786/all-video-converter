<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Shift - Video Converter</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#14110f">
<style>
:root{--bg:#f3efe8;--panel:#fff;--ink:#1c1917;--mute:#6b645c;--line:#ddd6cb;--acc:#0f766e;--accInk:#fff;--bar:#e7e1d6;--err:#b42318}
:root[data-theme=dark]{--bg:#14110f;--panel:#1f1b18;--ink:#f1ece4;--mute:#a39a8e;--line:#35302b;--acc:#2dd4bf;--accInk:#06201c;--bar:#35302b;--err:#f97066}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:10px;margin-bottom:22px}
header h1{font:700 26px/1 Georgia,"Times New Roman",serif;margin:0;flex:1;letter-spacing:-.5px}
button,select{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#drop{border:2px dashed var(--line);border-radius:14px;padding:38px 16px;text-align:center;background:var(--panel);transition:border-color .15s,background .15s}
#drop.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--panel))}
#drop p{margin:0 0 14px;color:var(--mute)}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.set label{display:flex;flex-direction:column;gap:4px;color:var(--mute);font-size:13px}
select{padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
#status{flex:1;color:var(--mute);font-size:13px;min-width:160px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nm{flex:1;min-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.meta{color:var(--mute);font-size:13px}
.meta.err{color:var(--err)}
.pb{height:6px;background:var(--bar);border-radius:3px;margin-top:10px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
a.btn{text-decoration:none;display:inline-block}
.empty{text-align:center;color:var(--mute);padding:24px 0}
footer{margin-top:30px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Reel Shift</h1>
  <button class="btn" id="install" hidden>Install app</button>
  <button class="btn" id="theme" aria-label="Switch light or dark theme">Dark</button>
</header>

<div id="drop">
  <p>Drag videos here (up to 5 at a time)</p>
  <button class="btn pri" id="add">Add videos</button>
  <input type="file" id="file" multiple hidden accept="video/*,audio/*,.mkv,.avi,.flv,.wmv,.3gp,.mpg,.mpeg,.ts,.vob,.m4v,.mts,.m2ts,.ogv,.divx">
</div>

<div class="set">
  <label>Output format
    <select id="fmt">
      <optgroup label="Video">
        <option value="mp4">MP4 (H.264)</option><option value="mkv">MKV</option><option value="avi">AVI</option>
        <option value="mov">MOV</option><option value="webm">WebM</option><option value="3gp">3GP (old phones)</option>
        <option value="flv">FLV</option><option value="wmv">WMV</option><option value="mpeg">MPEG</option><option value="gif">GIF (animated)</option>
      </optgroup>
      <optgroup label="Audio only">
        <option value="mp3">MP3</option><option value="aac">AAC</option><option value="m4a">M4A</option>
        <option value="wav">WAV</option><option value="flac">FLAC</option><option value="ogg">OGG</option>
      </optgroup>
    </select>
  </label>
  <label>Screen size
    <select id="preset">
      <option value="orig">Keep original size</option>
      <option value="mob">Small mobile (176x144)</option>
      <option value="240">240p - small phone</option>
      <option value="360">360p - phone</option>
      <option value="480">480p - tablet</option>
      <option value="720">720p HD - LCD/TV</option>
      <option value="1080">1080p Full HD - LCD/TV</option>
      <option value="2160">4K - big TV</option>
    </select>
  </label>
  <label>Quality / file size
    <select id="q">
      <option value="0">High quality (bigger file)</option>
      <option value="1" selected>Balanced</option>
      <option value="2">Small file</option>
    </select>
  </label>
</div>

<div class="bar">
  <button class="btn pri" id="all" disabled>Convert all</button>
  <button class="btn" id="zip" disabled>Download all (ZIP)</button>
  <button class="btn" id="clear" disabled>Clear all</button>
  <span id="status"></span>
</div>

<div id="list"><div class="empty">No videos yet. Add up to 5 videos to start.</div></div>

<footer>Videos are converted on your computer and never uploaded. Very large movies (over about 2 GB) may not fit in browser memory.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s), MAX=5;
let items=[], ff=null, ffLoading=null, chain=Promise.resolve(), uid=0, cur=null;

const AUDIO=['mp3','aac','m4a','wav','flac','ogg'], EXT={mpeg:'mpg'};
const CRF=[20,26,32], QV=[3,6,10], AB=['192k','128k','96k'], VPX=[10,18,28], MP3Q=[2,4,6], VQ=[6,4,2];

function args(inp,out,fmt,preset,q){
  const a=['-i',inp];
  if(AUDIO.includes(fmt)){
    a.push('-vn');
    const m={mp3:['-c:a','libmp3lame','-q:a',MP3Q[q]],aac:['-c:a','aac','-b:a',AB[q]],m4a:['-c:a','aac','-b:a',AB[q]],
      wav:['-c:a','pcm_s16le'],flac:['-c:a','flac'],ogg:['-c:a','libvorbis','-q:a',VQ[q]]};
    return a.concat(m[fmt],[out]);
  }
  let vf;
  if(fmt==='gif'){
    const h=preset==='mob'?144:(+preset||360);
    vf=`fps=10,scale=-2:${h}:flags=lanczos`;
  }else if(preset==='mob'){
    vf='scale=176:144:force_original_aspect_ratio=decrease,pad=176:144:(ow-iw)/2:(oh-ih)/2';
  }else if(preset==='orig'){
    vf='scale=trunc(iw/2)*2:trunc(ih/2)*2';
  }else vf=`scale=-2:${preset}`;
  a.push('-vf',vf);
  const m={
    mp4:['-c:v','libx264','-preset','veryfast','-crf',CRF[q],'-pix_fmt','yuv420p','-c:a','aac','-b:a',AB[q],'-movflags','+faststart'],
    mov:['-c:v','libx264','-preset','veryfast','-crf',CRF[q],'-pix_fmt','yuv420p','-c:a','aac','-b:a',AB[q],'-movflags','+faststart'],
    mkv:['-c:v','libx264','-preset','veryfast','-crf',CRF[q],'-pix_fmt','yuv420p','-c:a','aac','-b:a',AB[q]],
    webm:['-c:v','libvpx','-b:v','2M','-crf',VPX[q],'-deadline','realtime','-cpu-used','5','-c:a','libvorbis','-q:a',VQ[q]],
    avi:['-c:v','mpeg4','-q:v',QV[q],'-vtag','xvid','-c:a','libmp3lame','-q:a',MP3Q[q]],
    '3gp':['-c:v','mpeg4','-q:v',QV[q],'-c:a','aac','-ar','44100','-ac','1','-b:a','64k'],
    flv:['-c:v','flv','-q:v',QV[q],'-c:a','libmp3lame','-ar','44100','-q:a',MP3Q[q]],
    wmv:['-c:v','wmv2','-q:v',QV[q],'-c:a','wmav2','-b:a',AB[q]],
    mpeg:['-c:v','mpeg2video','-q:v',QV[q],'-c:a','mp2','-b:a',AB[q]],
    gif:['-an','-loop','0']
  };
  return a.concat(m[fmt],[out]);
}

const fmtSize=b=>b>=1e9?(b/1e9).toFixed(2)+' GB':b>=1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
const status=t=>$('#status').textContent=t||'';

function engine(){
  if(ff) return Promise.resolve(ff);
  if(ffLoading) return ffLoading;
  status('Loading converter engine (first time only)...');
  ffLoading=(async()=>{
    const {FFmpeg}=FFmpegWASM, {toBlobURL}=FFmpegUtil;
    const b='https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd';
    const c='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';
    const f=new FFmpeg();
    f.on('progress',({progress})=>{ if(cur){cur.p=Math.min(1,Math.max(0,progress));paint(cur);} });
    await f.load({
      classWorkerURL:await toBlobURL(b+'/814.ffmpeg.js','text/javascript'),
      coreURL:await toBlobURL(c+'/ffmpeg-core.js','text/javascript'),
      wasmURL:await toBlobURL(c+'/ffmpeg-core.wasm','application/wasm')
    });
    ff=f; status(''); return f;
  })();
  ffLoading.catch(()=>{ffLoading=null;status('Could not load the converter engine. Check your internet connection and try again.');});
  return ffLoading;
}

function addFiles(files){
  const room=MAX-items.length;
  if(room<=0){status('The queue is full (5 videos). Remove or clear some first.');return;}
  const take=[...files].slice(0,room);
  if(files.length>room) status('Only '+room+' more video(s) fit in the queue of 5.');
  take.forEach(file=>{
    const it={id:++uid,file,state:'idle',p:0,url:null,out:'',outSize:0,msg:''};
    const el=document.createElement('div'); el.className='card';
    el.innerHTML='<div class="row"><span class="nm"></span><span class="meta sz"></span><button class="btn go">Convert</button><a class="btn pri dl" hidden>Download</a><button class="btn rm" aria-label="Remove">Remove</button></div><div class="meta st" style="margin-top:6px"></div><div class="pb"><i></i></div>';
    el.querySelector('.nm').textContent=file.name; el.querySelector('.nm').title=file.name;
    el.querySelector('.sz').textContent=fmtSize(file.size);
    el.querySelector('.go').onclick=()=>queue(it);
    el.querySelector('.rm').onclick=()=>remove(it);
    it.el=el; items.push(it); $('#list').appendChild(el); paint(it);
  });
  refresh();
}

function paint(it){
  const e=it.el, s=it.state;
  const st=e.querySelector('.st'), go=e.querySelector('.go'), dl=e.querySelector('.dl'), rm=e.querySelector('.rm');
  e.querySelector('.pb i').style.width=(s==='done'?100:it.p*100)+'%';
  st.className='meta st'+(s==='err'?' err':'');
  st.textContent={idle:'Ready',wait:'Waiting in queue...',run:'Converting... '+Math.round(it.p*100)+'%',
    done:'Done. '+it.out+' ('+fmtSize(it.outSize)+')',err:it.msg||'Conversion failed'}[s];
  go.hidden=(s==='run'||s==='wait'); go.textContent=s==='done'||s==='err'?'Convert again':'Convert';
  dl.hidden=s!=='done'; if(s==='done'){dl.href=it.url;dl.download=it.out;}
  rm.textContent=s==='run'?'Cancel':'Remove';
}

function refresh(){
  const any=items.length>0;
  $('#all').disabled=!items.some(i=>i.state==='idle'||i.state==='err');
  $('#zip').disabled=!items.some(i=>i.state==='done');
  $('#clear').disabled=!any;
  if(!any) $('#list').innerHTML='<div class="empty">No videos yet. Add up to 5 videos to start.</div>';
  else $('#list .empty')?.remove();
}

function remove(it){
  if(it.state==='run'){ it.cancel=true; if(ff){ff.terminate();ff=null;ffLoading=null;} return; }
  if(it.state==='wait') it.cancel=true;
  if(it.url) URL.revokeObjectURL(it.url);
  it.el.remove(); items=items.filter(i=>i!==it); refresh();
}

function queue(it){
  it.state='wait'; it.cancel=false; it.p=0; paint(it); refresh();
  chain=chain.then(()=>convert(it));
}

async function convert(it){
  if(it.cancel||!items.includes(it)) return;
  const fmt=$('#fmt').value, preset=$('#preset').value, q=+$('#q').value;
  const ext=EXT[fmt]||fmt, base=it.file.name.replace(/\.[^.]+$/,'')||'video';
  const inn='in'+it.id, out='out'+it.id+'.'+ext;
  it.state='run'; it.p=0; cur=it; paint(it); status('');
  let f;
  try{
    f=await engine();
    await f.writeFile(inn,await FFmpegUtil.fetchFile(it.file));
    const code=await f.exec(args(inn,out,fmt,preset,q));
    if(code!==0) throw new Error('This file could not be converted. It may be damaged or use an unsupported codec.');
    const data=await f.readFile(out);
    if(it.url) URL.revokeObjectURL(it.url);
    it.url=URL.createObjectURL(new Blob([data.buffer]));
    it.outSize=data.length; it.out=base+'.'+ext; it.state='done'; it.p=1;
    await f.deleteFile(inn).catch(()=>{}); await f.deleteFile(out).catch(()=>{});
  }catch(e){
    if(it.cancel){ it.state='idle'; it.cancel=false; it.p=0; if(items.includes(it)){ it.el.remove(); items=items.filter(i=>i!==it); } }
    else{ it.state='err'; it.msg=(e&&e.message)||'Conversion failed'; if(/memory|alloc/i.test(it.msg)) it.msg='Not enough browser memory for this file. Try a smaller file.'; }
  }
  cur=null; if(items.includes(it)) paint(it); refresh();
}

$('#add').onclick=()=>$('#file').click();
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value='';};
const d=$('#drop');
['dragenter','dragover'].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();d.classList.add('over');}));
['dragleave','drop'].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();d.classList.remove('over');}));
d.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
$('#all').onclick=()=>items.filter(i=>i.state==='idle'||i.state==='err').forEach(queue);
$('#clear').onclick=()=>{
  [...items].forEach(it=>{ if(it.state==='run'){it.cancel=true;if(ff){ff.terminate();ff=null;ffLoading=null;}} else { it.cancel=true; if(it.url)URL.revokeObjectURL(it.url); it.el.remove(); } });
  items=items.filter(i=>i.state==='run'); refresh();
};
$('#zip').onclick=async()=>{
  const z=new JSZip(), used={};
  for(const it of items.filter(i=>i.state==='done')){
    let n=it.out; if(used[n]){ n=n.replace(/(\.[^.]+)$/,'_'+used[n]+'$1'); } used[it.out]=(used[it.out]||0)+1;
    z.file(n,await (await fetch(it.url)).blob());
  }
  status('Creating ZIP...');
  const blob=await z.generateAsync({type:'blob',compression:'STORE'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='converted-videos.zip'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000); status('');
};

// theme
const root=document.documentElement;
function setTheme(t){root.dataset.theme=t;$('#theme').textContent=t==='dark'?'Light':'Dark';
  try{localStorage.setItem('rs-theme',t);}catch(e){}}
let saved=null; try{saved=localStorage.getItem('rs-theme');}catch(e){}
setTheme(saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('#theme').onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark');

// install + offline
let deferred=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#install').hidden=false;});
$('#install').onclick=async()=>{ if(!deferred)return; deferred.prompt(); await deferred.userChoice; deferred=null; $('#install').hidden=true; };
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
